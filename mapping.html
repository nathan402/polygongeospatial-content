<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Video 3</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .video-wrapper {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      border: 0;
      display: block;
    }

    @media screen and (max-width: 768px) {
      .video-wrapper iframe {
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <iframe 
      src="https://www.youtube-nocookie.com/embed/1THVNLoJk-Y?autoplay=1&mute=1&loop=1&playlist=1THVNLoJk-Y&controls=0&rel=0&playsinline=1"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
